<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог книг — SPA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            color: #333;
        }

        .app {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #4a63e7, #764ba2);
            color: white;
            padding: 26px 24px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        header .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 3px solid rgba(255,255,255,0.5);
        }
        header h1 { margin: 0 0 4px; font-size: 22px; }
        header p  { margin: 0; opacity: 0.85; font-size: 14px; }
        header .badge {
            margin-left: auto;
            background: rgba(255,255,255,0.2);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        nav {
            display: flex;
            border-bottom: 2px solid #eee;
            background: #fafbff;
        }
        nav button {
            flex: 1;
            padding: 16px 10px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            color: #777;
            cursor: pointer;
            position: relative;
            transition: color 0.2s, background 0.2s;
        }
        nav button:hover { background: #f0f2fb; color: #4a63e7; }
        nav button.active { color: #4a63e7; }
        nav button.active::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0; right: 0;
            height: 3px;
            background: #4a63e7;
            border-radius: 3px 3px 0 0;
        }

        main {
            padding: 24px;
            min-height: 380px;
        }

        .fade-in { animation: fadeIn 0.35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .toolbar input,
        .toolbar select {
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }
        .toolbar input:focus,
        .toolbar select:focus {
            outline: none;
            border-color: #4a63e7;
        }
        .toolbar input {
            flex: 1;
            min-width: 180px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .book {
            background: #f9fafd;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .book:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .book .cover { font-size: 34px; margin-bottom: 8px; }
        .book h3 { margin: 0 0 4px; font-size: 16px; color: #333; line-height: 1.3; }
        .book .author { color: #777; font-size: 13px; margin-bottom: 8px; }
        .book .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .book .chip {
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 12px;
            background: #eef0fb;
            color: #4a63e7;
            font-weight: 600;
        }
        .book .chip.year { background: #fff4e5; color: #c47c16; }
        .fav-btn {
            margin-top: auto;
            padding: 9px 12px;
            border: 2px solid #4a63e7;
            background: white;
            color: #4a63e7;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .fav-btn:hover { background: #eef0fb; }
        .fav-btn.active { background: #4a63e7; color: white; }
        .fav-btn.active:hover { background: #3849b8; }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-size: 16px;
        }
        .empty .icon { font-size: 52px; display: block; margin-bottom: 12px; }

        .about h2 { margin-top: 0; color: #333; }
        .about p { line-height: 1.7; color: #444; }
        .about .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .about .feature {
            background: #f7f8fc;
            padding: 16px;
            border-radius: 10px;
            border-left: 4px solid #4a63e7;
        }
        .about .feature b {
            display: block;
            color: #4a63e7;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .about .feature span { font-size: 13px; color: #555; }

        footer {
            text-align: center;
            padding: 14px;
            font-size: 12px;
            color: #aaa;
            background: #fafbff;
            border-top: 1px solid #eee;
        }

        /* ⭐ Подсветка клавиатурного фокуса */
        nav button:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        a:focus-visible,
        [tabindex]:focus-visible {
            outline: 3px solid #ff9800;
            outline-offset: 2px;
            border-radius: 6px;
        }
        button:focus:not(:focus-visible) { outline: none; }

        /* Подсказка по горячим клавишам */
        .hotkeys-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 8px 16px;
            background: #fafbff;
            border-bottom: 1px solid #eee;
        }
        .hotkeys-hint kbd {
            background: #eef0fb;
            color: #4a63e7;
            border-radius: 4px;
            padding: 2px 6px;
            font-family: monospace;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid #d6dbf5;
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">📚</div>
            <div>
                <h1>Городская библиотека</h1>
                <p>Электронный каталог книг</p>
            </div>
            <div class="badge" id="favBadge">❤ 0</div>
        </header>

        <nav id="tabs">
            <button data-page="catalog">Каталог</button>
            <button data-page="favorites">Избранное</button>
            <button data-page="about">О библиотеке</button>
        </nav>

        <div class="hotkeys-hint">
            <kbd>←</kbd> <kbd>→</kbd> вкладки &nbsp;•&nbsp;
            <kbd>Alt+1..3</kbd> быстрый переход &nbsp;•&nbsp;
            <kbd>/</kbd> поиск &nbsp;•&nbsp;
            <kbd>Esc</kbd> снять фокус
        </div>

        <main id="content" aria-live="polite"></main>

        <footer>© 2026 Городская библиотека · SPA на чистом JavaScript</footer>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
